- title: Open Source
  type: time_table
  contents:
    - title: AnyJev — lead author and principal maintainer
      institution: Nokia Applied Research
      year: 2026
      description:
        - "Turns any LLM into a typed decision model with calibrated probabilities, training-free by default — served through vLLM as a pooling endpoint plus a few kilobytes of closed-form head."
        - "Cuts option-order sensitivity 0.230 to 0.073 and calibration error 0.240 to 0.095 with zero labels; raises the share auto-decidable at 5% risk from 7.7% to 52.0% with 100-500 labels."
        - "Passed 500 GitHub stars in its first three days."
      linkitems:
        - link: https://github.com/nokia-applied-research/AnyJev
          linkname: GitHub
        - link: https://pypi.org/project/anyjev/
          linkname: PyPI

