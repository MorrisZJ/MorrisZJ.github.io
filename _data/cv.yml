- title: Research Interests
  type: list
  contents:
    - "<b>Memory-bound LLM inference.</b> KV cache compression, quantization and transform coding for long-context and agentic workloads."
    - "<b>Conditional computation.</b> Mixture-of-Experts and training-free routing that turn static redundancy in pretrained models into input-dependent sparsity — and the serving systems that realize it under real memory budgets."
    - "<b>Efficient and verifiable agentic systems.</b> Cutting redundant computation and communication in LLM agents and multi-agent systems — and rigorously evaluating whether reported efficiency gains are real."

